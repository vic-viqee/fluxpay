[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxpay-py"
version = "0.1.0"
description = "FluxPay M-Pesa payment gateway client (Python)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]

[tool.setuptools]
packages = ["fluxpay"]